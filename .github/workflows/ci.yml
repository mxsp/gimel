name: CI

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build web & agentlab frontends
        run: |
          (cd web && npm ci --no-audit --no-fund && npm run build)
          (cd agentlab/web && npm ci --no-audit --no-fund && npm run build)
      - name: Run frontend nav & jump tests
        run: |
          cd web
          node nav-groups.test.mjs
          node jump.test.mjs
      - name: Install Python deps & run pytest
        run: |
          python -m pip install --upgrade pip
          pip install -e ".[dev]"
          pytest tests/app/test_modules.py tests/app/test_platform.py tests/app/test_security_headers.py tests/core/ -q

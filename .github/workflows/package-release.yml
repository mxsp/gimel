name: Package Release (Container + Windows .exe + Linux Binary)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write
  id-token: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Ensure Inno Setup is available
        shell: pwsh
        run: |
          if (-not (Get-Command iscc -ErrorAction SilentlyContinue) -and -not (Test-Path "C:\Program Files (x86)\Inno Setup 6\ISCC.exe")) {
            choco install innosetup -y --no-progress
          }
      - name: Build Windows gimel (--onedir bundle)
        shell: pwsh
        run: ./packaging/build-exe.ps1 -SkipInno

      - name: Azure Login for Trusted Signing (optional — runs when AZURE_SIGNING_ENDPOINT variable is set)
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Sign gimel.exe with Azure Trusted Signing
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\dist\gimel
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Build Windows UI Installer (Gimel-Setup-x64.exe)
        shell: pwsh
        run: ./packaging/build-exe.ps1 -OnlyInno

      - name: Sign Gimel-Setup-x64.exe with Azure Trusted Signing
        if: ${{ vars.AZURE_SIGNING_ENDPOINT != '' }}
        uses: azure/trusted-signing-action@v0.5.9
        with:
          azure-tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          endpoint: ${{ vars.AZURE_SIGNING_ENDPOINT }}
          trusted-signing-account-name: ${{ vars.AZURE_SIGNING_ACCOUNT }}
          certificate-profile-name: ${{ vars.AZURE_SIGNING_PROFILE }}
          files-folder: ${{ github.workspace }}\packaging\dist
          files-folder-filter: exe
          file-digest: SHA256
          timestamp-rfc3161: http://timestamp.acs.microsoft.com
          timestamp-digest: SHA256

      - name: Archive Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Force -Path "packaging/dist/gimel/*" -DestinationPath release-assets/gimel-windows-x64.zip
          if (Test-Path packaging/dist/Gimel-Setup-x64.exe) {
            Copy-Item packaging/dist/Gimel-Setup-x64.exe release-assets/Gimel-Setup-x64.exe
          } else {
            throw "Gimel-Setup-x64.exe was not generated by Inno Setup!"
          }
      - name: Upload Windows release archive & installer
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: |
            release-assets/gimel-windows-x64.zip
            release-assets/Gimel-Setup-x64.exe

  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install . "pyinstaller>=6.10"
      - name: Install JS deps
        run: |
          cd web && npm ci --no-audit --no-fund
          cd ../agentlab/web && npm ci --no-audit --no-fund
      - name: Build Linux standalone binary
        run: chmod +x packaging/build-exe.sh && ./packaging/build-exe.sh
      - name: Archive Linux release bundle
        run: |
          mkdir -p release-assets
          tar -czf release-assets/gimel-linux-x64.tar.gz -C packaging/dist gimel start-playground.sh start-production.sh
      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/gimel-linux-x64.tar.gz

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Gimel dual-mode container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gimel:latest

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, linux-binary, container]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum gimel-linux-x64.tar.gz gimel-windows-x64.zip Gimel-Setup-x64.exe > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          make_latest: true
          prerelease: false
          files: |
            release-assets/gimel-linux-x64.tar.gz
            release-assets/gimel-windows-x64.zip
            release-assets/Gimel-Setup-x64.exe
            release-assets/SHA256SUMS.txt

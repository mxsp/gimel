name: Package Release (Container + Windows .exe + Linux Binary)

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows-exe:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build Windows gimel.exe (Playground + Production)
        shell: pwsh
        run: ./packaging/build-exe.ps1
      - name: Archive Windows release bundle
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path release-assets | Out-Null
          Compress-Archive -Force -Path `
            packaging/dist/gimel.exe, `
            packaging/dist/Start-Gimel-Playground.bat, `
            packaging/dist/Start-Gimel-Production.bat, `
            packaging/dist/Start-Gimel-Both.bat `
            -DestinationPath release-assets/gimel-windows-x64.zip
      - name: Upload Windows release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-windows
          path: release-assets/gimel-windows-x64.zip

  linux-binary:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Python deps
        run: |
          python -m venv .venv
          .venv/bin/pip install --upgrade pip
          .venv/bin/pip install . "pyinstaller>=6.10"
      - name: Install JS deps
        run: |
          cd web && npm ci --no-audit --no-fund
          cd ../agentlab/web && npm ci --no-audit --no-fund
      - name: Build Linux standalone binary
        run: chmod +x packaging/build-exe.sh && ./packaging/build-exe.sh
      - name: Archive Linux release bundle
        run: |
          mkdir -p release-assets
          tar -czf release-assets/gimel-linux-x64.tar.gz -C packaging/dist gimel start-playground.sh start-production.sh
      - name: Upload Linux release archive
        uses: actions/upload-artifact@v4
        with:
          name: release-linux
          path: release-assets/gimel-linux-x64.tar.gz

  container:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - name: Build Gimel dual-mode container image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          tags: gimel:latest

  publish-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [windows-exe, linux-binary, container]
    runs-on: ubuntu-latest
    steps:
      - name: Download release archives
        uses: actions/download-artifact@v4
        with:
          pattern: release-*
          path: release-assets
          merge-multiple: true
      - name: Generate SHA256SUMS.txt
        run: |
          cd release-assets
          sha256sum gimel-linux-x64.tar.gz gimel-windows-x64.zip > SHA256SUMS.txt
          cat SHA256SUMS.txt
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release-assets/gimel-linux-x64.tar.gz
            release-assets/gimel-windows-x64.zip
            release-assets/SHA256SUMS.txt

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "gimel"
version = "1.0.2"
description = "Order and production management for manufacturers and job shops (in development, not released)"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Proprietary — FyreFly Systems GbR" }
authors = [{ name = "FyreFly Systems GbR" }]
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy>=2.0",
  "pydantic>=2.7",
  "pydantic-settings>=2.3",
  "email-validator>=2.1",
  "python-multipart>=0.0.9",
  "pyjwt>=2.8",
  "bcrypt>=4.1",
  "httpx>=0.27",
  "ezdxf>=1.3",
  "stripe>=7.0",
  "cryptography>=42.0",
  "numpy>=2.0",
  "pypdf>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27", "opencv-python-headless>=4.9"]
vision = ["opencv-python-headless>=4.9"]
tts = ["edge-tts>=7.0"]
# Gimel Voice: Erkennung und Sprachausgabe auf diesem Rechner. av < 15, weil
# faster-whisper 1.2 av.open(metadata_errors=…) aufruft, das av 15+ nicht kennt.
# piper-tts ist GPL-3.0 (eigenständiges Paket, wird nur importiert); vor einer
# Weitergabe von Gimel in LICENCES aufnehmen. edge-tts (Microsoft-Cloud) bleibt
# bewusst nur in [tts].
voice = ["faster-whisper>=1.1,<2", "av>=13,<15", "piper-tts>=1.3,<2"]

[project.scripts]
gimel = "gimel.cli:main"

[tool.setuptools.packages.find]
include = ["gimel*", "agentlab*"]

[tool.setuptools.package-data]
gimel = ["admin/*", "webapp/dist/**/*", "twin/dist/**/*", "studio/dist/**/*"]
agentlab = ["webapp/dist/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
